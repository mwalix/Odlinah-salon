<html lang="en">  
<head>

    <title>Odlinah Salon</title>

    <style>  
        :root {  
            --bg-color: #121212;  
            --card-bg: rgba(255, 255, 255, 0.05);  
            --border-glass: rgba(255, 255, 255, 0.1);  
            --gold: #D4AF37;  
            --text-main: #FFFFFF;  
            --text-muted: #CCCCCC;  
        }  
        body {  
            background-color: var(--bg-color);  
            color: var(--text-main);  
            font-family: 'Plus Jakarta Sans', sans-serif;  
            margin: 0;  
            padding: 0;  
            padding-bottom: 90px;  
            box-sizing: border-box;  
            overflow-x: hidden;  
        }  
        header {  
            display: flex;  
            justify-content: space-between;  
            align-items: center;  
            padding: 20px;  
            background: rgba(18, 18, 18, 0.8);  
            backdrop-filter: blur(12px);  
            border-bottom: 1px solid var(--border-glass);  
            position: sticky;  
            top: 0;  
            z-index: 100;  
        }  
        .brand-logo-area {  
            display: flex;  
            align-items: center;  
            gap: 12px;  
            cursor: pointer;  
            user-select: none;  
        }  
        .logo-box {  
            width: 45px;  
            height: 45px;  
            background: linear-gradient(135deg, #1e3a8a, var(--gold));  
            border-radius: 12px;  
            display: flex;  
            align-items: center;  
            justify-content: center;  
            font-weight: bold;  
            font-size: 20px;  
            color: white;  
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);  
        }  
        .brand-title h1 {  
            font-family: 'Playfair Display', serif;  
            font-size: 18px;  
            margin: 0;  
            letter-spacing: 1px;  
        }  
        .brand-title p {  
            font-size: 11px;  
            color: var(--gold);  
            margin: 0;  
            text-transform: uppercase;  
        }  
        .hours-badge {  
            border: 1px solid var(--gold);  
            border-radius: 20px;  
            padding: 6px 12px;  
            font-size: 10px;  
            color: var(--gold);  
            text-transform: uppercase;  
            letter-spacing: 0.5px;  
        }  
        .hero {  
            padding: 40px 20px;  
            text-align: center;  
            background: linear-gradient(180deg, rgba(214,175,55,0.05) 0%, rgba(18,18,18,0) 100%);  
        }  
        .hero h2 {  
            font-family: 'Playfair Display', serif;  
            font-size: 42px;  
            margin: 0 0 16px 0;  
            line-height: 1.1;  
        }  
        .hero p {  
            color: var(--text-muted);  
            font-size: 15px;  
            line-height: 1.6;  
            max-width: 500px;  
            margin: 0 auto 24px auto;  
        }  
        .category-container {  
            padding: 15px 20px;  
            overflow-x: auto;  
            white-space: nowrap;  
            display: flex;  
            gap: 12px;  
            scrollbar-width: none;  
            border-bottom: 1px solid var(--border-glass);  
            background: rgba(255,255,255,0.01);  
        }  
        .category-container::-webkit-scrollbar {  
            display: none;  
        }  
        .pill-btn {  
            background: var(--card-bg);  
            border: 1px solid var(--border-glass);  
            color: var(--text-main);  
            padding: 10px 20px;  
            border-radius: 25px;  
            font-size: 13px;  
            cursor: pointer;  
            backdrop-filter: blur(10px);  
            transition: all 0.3s;  
        }  
        .pill-btn.active {  
            background: var(--gold);  
            color: #121212;  
            border-color: var(--gold);  
            font-weight: bold;  
            box-shadow: 0 0 10px rgba(214, 175, 55, 0.4);  
        }  
        .section-title {

        }

            font-family: 'Playfair Display', serif;  
            font-size: 28px;  
            margin: 0 0 6px 0;  
        }  
        .section-title p {  
            color: var(--text-muted);  
            font-size: 13px;  
            margin: 0;  
        }  
        .gallery-grid {  
            display: grid;  
            grid-template-columns: repeat(2, 1fr);  
            gap: 15px;  
            padding: 15px 20px;  
        }  
        .gallery-item {  
            background: var(--card-bg);  
            border: 1px solid var(--border-glass);  
            border-radius: 16px;  
            overflow: hidden;  
            backdrop-filter: blur(12px);  
            cursor: pointer;  
            position: relative;  
            transition: all 0.3s;  
            display: block;  
        }  
        .gallery-item.selected {  
            border: 2px solid var(--gold);  
            box-shadow: 0 0 15px rgba(214, 175, 55, 0.3);  
        }  
        .gallery-img {  
            width: 100%;  
            height: 190px;  
            object-fit: cover;  
            display: block;  
        }  
        .gallery-info {  
            padding: 12px;  
            background: rgba(0, 0, 0, 0.6);  
        }  
        .gallery-info h4 {  
            margin: 0 0 4px 0;  
            font-size: 14px;  
        }  
        .gallery-info p {  
            margin: 0;  
            font-size: 11px;  
            color: var(--gold);  
            font-weight: 600;  
        }  
        .booking-section {  
            padding: 24px;  
            margin: 25px 20px;  
            background: rgba(255, 255, 255, 0.02);  
            border: 1px solid var(--border-glass);  
            border-radius: 20px;  
            backdrop-filter: blur(12px);  
        }  
        .form-group {  
            margin-bottom: 18px;  
        }  
        .form-group label {  
            display: block;  
            font-size: 12px;  
            color: var(--text-muted);  
            margin-bottom: 8px;  
            text-transform: uppercase;  
        }  
        .form-control {  
            width: 100%;  
            background: rgba(0, 0, 0, 0.4);  
            border: 1px solid var(--border-glass);  
            border-radius: 10px;  
            padding: 14px;  
            color: white;  
            font-family: inherit;  
            box-sizing: border-box;  
            font-size: 14px;  
        }  
        .form-control:focus {  
            outline: none;  
            border-color: var(--gold);  
        }  
        .action-row {  
            display: flex;  
            gap: 12px;  
            margin-top: 24px;  
        }  
        .action-btn {  
            flex: 1;  
            padding: 15px;  
            border-radius: 12px;  
            border: none;  
            font-weight: bold;  
            cursor: pointer;  
            display: flex;  
            align-items: center;  
            justify-content: center;  
            gap: 8px;  
            text-decoration: none;  
            font-size: 14px;  
            transition: opacity 0.2s;  
        }  
        .action-btn:active {  
            opacity: 0.8;  
        }  
        .btn-whatsapp {  
            background: #25D366;  
            color: white;  
        }  
        .btn-call {  
            background: #2563eb;  
            color: white;  
        }  
        .nav-bar {  
            position: fixed;  
            bottom: 0;  
            left: 0;  
            right: 0;  
            background: rgba(18, 18, 18, 0.95);  
            backdrop-filter: blur(15px);  
            border-top: 1px solid var(--border-glass);  
            display: flex;  
            justify-content: space-around;  
            padding: 14px 0;  
            z-index: 99;  
        }  
        .nav-item {  
            background: none;

            color: var(--text-muted);  
            font-size: 12px;  
            cursor: pointer;  
            display: flex;  
            flex-direction: column;  
            align-items: center;  
            gap: 4px;  
        }  
        .nav-item.active {  
            color: var(--gold);  
            font-weight: bold;  
        }

            align-items: center;  
            z-index: 1000;  
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);  
        }

            color: white;  
        }  
        .pwa-text p {

            color: var(--text-muted);  
        }
